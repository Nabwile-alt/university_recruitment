{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body">
                <h5>{{ job.title }}</h5>
                <p class="text-muted mb-0"><i class="bi bi-building me-1"></i>{{ job.university.name }} | <i class="bi bi-geo-alt me-1"></i>{{ job.location }}</p>
            </div>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white"><h5 class="mb-0">Submit Your Application</h5></div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-2"><i class="bi bi-send me-2"></i>Submit Application</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
