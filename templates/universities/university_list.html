{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Partner Universities</h2>
<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for uni in universities %}
    <div class="col">
        <div class="card border-0 shadow-sm h-100">
            {% if uni.logo %}
            <img src="{{ uni.logo.url }}" class="card-img-top p-3" alt="{{ uni.name }}" style="height:150px;object-fit:contain">
            {% else %}
            <div class="text-center py-4"><i class="bi bi-building display-3 text-primary"></i></div>
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ uni.name }}</h5>
                <p class="text-muted small">{{ uni.address }}</p>
                {% if uni.website %}<a href="{{ uni.website }}" target="_blank" class="btn btn-sm btn-outline-primary me-2">Website</a>{% endif %}
                <a href="{% url 'university_detail' uni.pk %}" class="btn btn-sm btn-primary">View Jobs</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <i class="bi bi-building display-1 text-muted"></i>
        <h5 class="mt-3 text-muted">No universities listed yet.</h5>
    </div>
    {% endfor %}
</div>
{% endblock %}
