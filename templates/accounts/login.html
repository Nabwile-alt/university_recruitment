{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" required placeholder="your@email.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <hr>
                <p class="text-center mb-0">Don't have an account?</p>
                <div class="d-flex gap-2 mt-2">
                    <a href="{% url 'register_student' %}" class="btn btn-outline-secondary btn-sm w-100">Student</a>
                    <a href="{% url 'register_employer' %}" class="btn btn-outline-secondary btn-sm w-100">Employer</a>
                    <a href="{% url 'register_staff' %}" class="btn btn-outline-secondary btn-sm w-100">Staff</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
